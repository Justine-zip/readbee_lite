name: CI
on:
  push:
    branches: 
      - master
      - ci_test
      - test_init
  pull_request:
    branches: 
      - master
      - ci_test

jobs:
  flutter_test:
    name: Continous Integration Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-java@v1
        with:
          java-version: "12.x"
      - uses: subosito/flutter-action@v1
        with:
          channel: "stable"
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test